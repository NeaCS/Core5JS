<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Petlopedia</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="contenedor">
      <div class="navbar">
        <h1>Petlopedia</h1>

        <input type="text" placeholder="Buscar mascotas" class="buscador" />

        <button class="boton-login">Iniciar sesión</button>
      </div>

      <div class="contenido">
        <div class="columna-izquierda">
          <div class="tarjeta">
            <h2>Gato Atigrado</h2>
            <p class="tipo">sustantivo</p>
            <p>Plural: Gatos Atigrados</p>
            <p>
              Un gato con un pelaje distintivo que presenta rayas, puntos o patrones en remolino.
            </p>
            <button id="boton-like">22 me gusta</button>
          </div>
          <div class="tarjeta">
            <h2>Golden Retriever</h2>
            <p class="tipo">sustantivo</p>
            <p>Plural: Golden Retrievers</p>
            <p>Una raza de perro amistosa, inteligente y devota.</p>
            <button class="boton-like">45 me gusta</button>
          </div>
        </div>
        <div class="columna-derecha">
          <div class="definicion">
            <p>Petlopedia está definida por TI</p>
            <button id="boton-agregar">Agregar Definición</button>
          </div>
        </div>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
